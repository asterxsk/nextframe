name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time; a newer push supersedes a run still in flight
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Typecheck
        working-directory: web
        run: npx tsc --noEmit

      - name: Build
        working-directory: web
        run: npm run build
        env:
          # vite.config.ts already sets base: '/nextframe/'
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Check the fonts resolve
        # index.css points at /fonts/*, which Vite leaves as-is (it only rewrites
        # URLs it hashed). At base '/nextframe/' that is an absolute path off the
        # site root, so assert the file the page asks for is the file published.
        working-directory: web
        run: |
          for f in dist/fonts/*.woff2; do
            name=$(basename "$f")
            grep -q "/nextframe/fonts/$name" dist/assets/*.css \
              || { echo "::error::$name is not referenced by the built CSS at the right path"; exit 1; }
            grep -q "/nextframe/fonts/$name" dist/index.html \
              || { echo "::error::$name is not preloaded from the right path"; exit 1; }
          done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
